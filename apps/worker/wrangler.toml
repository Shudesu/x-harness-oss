name = "x-harness-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# Set via: wrangler secret put API_KEY
# Set via: wrangler secret put ENCRYPTION_KEY (base64, 32 random bytes)
# Optional: wrangler secret put XAI_API_KEY
# ADMIN_ORIGIN must list the dashboard origin(s), comma-separated.

[vars]
WORKER_URL = "https://x-harness-worker.your-subdomain.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "x-harness"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "../../packages/db/bootstrap"

[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding = "GROWTH_IMAGES"
bucket_name = "x-harness-growth-images"

[[durable_objects.bindings]]
name = "GATE_CLAIMS"
class_name = "GateClaimCoordinator"

[[migrations]]
tag = "gate-claims-v1"
new_sqlite_classes = ["GateClaimCoordinator"]

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true
