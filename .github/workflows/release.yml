name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish only a verified main-branch commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          node scripts/check-version.mjs
          notes="docs/releases/$RELEASE_TAG.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; published notes are not overwritten."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG — X Harness" --notes-file "$notes"
