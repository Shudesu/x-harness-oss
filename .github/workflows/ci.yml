name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - name: Apply fresh migrations in local D1
        run: pnpm --filter worker exec wrangler d1 migrations apply x-harness --local --persist-to ../../.local/d1-ci
      - name: Bundle Worker without deployment
        run: pnpm --filter worker exec wrangler deploy --dry-run --outdir ../../.local/worker-release
