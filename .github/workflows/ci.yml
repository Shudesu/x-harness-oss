name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      release_tag:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check explicitly requested release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" node scripts/check-version.mjs
      - run: pnpm release:check
      - name: Apply fresh migrations in local D1
        run: pnpm --filter worker exec wrangler d1 migrations apply x-harness --local --persist-to ../../.local/d1-ci
      - name: Bundle Worker without deployment
        run: pnpm --filter worker exec wrangler deploy --dry-run --outdir ../../.local/worker-release
      - name: Exercise gate PNG, Durable Object and D1 through local workerd
        run: node scripts/smoke-gates.mjs
